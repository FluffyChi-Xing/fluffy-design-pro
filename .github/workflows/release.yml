name: Release CLI

on:
  workflow_dispatch:
  push:
    tags: ['cli-v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
      - run: pnpm docs:build
      - run: pnpm --filter @fluffy-design-pro/cli pack
      - run: pnpm --filter @fluffy-design-pro/cli publish --access public --provenance
